<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090B"/>
  
  <!-- Subtle Gradient Glow -->
  <circle cx="1100" cy="100" r="400" fill="#F97316" fill-opacity="0.15" filter="blur(120px)"/>
  <circle cx="100" cy="550" r="300" fill="#EA580C" fill-opacity="0.1" filter="blur(100px)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#27272A" stroke-width="2"/>

  <!-- Logo Icon -->
  <rect x="70" y="65" width="52" height="52" rx="12" fill="#F97316"/>
  <text x="96" y="102" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">5</text>

  <!-- Title & Subtitle in Header -->
  <text x="136" y="92" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">HTML5 Reference</text>
  <text x="136" y="112" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Complete Educational Guide</text>

  <!-- Pill Badge -->
  <rect x="910" y="70" width="220" height="38" rx="19" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
  <text x="1020" y="94" fill="#FB923C" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">100% WHATWG LIVING STANDARD</text>

  <!-- Main Headline -->
  <text x="70" y="250" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">Every HTML Tag &amp; Attribute,</text>
  <text x="70" y="315" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">Documented &amp; Demonstrated.</text>

  <!-- Tagline -->
  <text x="70" y="375" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">
    All 134 elements, 26 global attributes, 130 entities, accessibility guidelines,
  </text>
  <text x="70" y="405" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">
    and authentic unstyled native browser output with zero injected CSS.
  </text>

  <!-- Divider -->
  <line x1="70" y1="490" x2="1130" y2="490" stroke="#27272A" stroke-width="1.5"/>

  <!-- Bottom Metric 1 -->
  <text x="70" y="545" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">134</text>
  <text x="122" y="543" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">HTML Tags</text>

  <!-- Bottom Metric 2 -->
  <text x="260" y="545" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">26</text>
  <text x="300" y="543" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">Global Attributes</text>

  <!-- Bottom Metric 3 -->
  <text x="490" y="545" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">130</text>
  <text x="542" y="543" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">Entities</text>

  <!-- Bottom Metric 4 -->
  <text x="660" y="545" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">100%</text>
  <text x="735" y="543" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">Native Previews</text>

  <!-- Author Attribution -->
  <text x="1130" y="543" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="end">Made with 🧡 by Yaseen</text>
</svg>
